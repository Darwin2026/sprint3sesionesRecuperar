<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambiar contraseña</title>

    <script>
        function validarFormulario() {
            const actual = document.getElementById("actual").value.trim();
            const nueva = document.getElementById("nueva").value.trim();
            const nueva2 = document.getElementById("nueva2").value.trim();

            if (actual === "" || nueva === "" || nueva2 === "") {
                alert("Todos los campos son obligatorios.");
                return false;
            }

            if (nueva !== nueva2) {
                alert("Las nuevas contraseñas no coinciden.");
                return false;
            }

            return true;
        }
    </script>
</head>
<body>

<h1>Cambiar contraseña</h1>

<form action="change_password.php" method="POST" onsubmit="return validarFormulario()">
    <label>Contraseña actual:</label><br>
    <input type="password" name="actual" id="actual"><br><br>

    <label>Nueva contraseña:</label><br>
    <input type="password" name="nueva" id="nueva"><br><br>

    <label>Repetir nueva contraseña:</label><br>
    <input type="password" name="nueva2" id="nueva2"><br><br>

    <button type="submit">Cambiar contraseña</button>
</form>

<p><a href="main.php">Volver</a></p>

</body>
</html>
